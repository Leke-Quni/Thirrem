<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thirrem Driver: a simulated ride-hailing demo</title>
    <meta name="description" content="Try the Driver side of a ride-hailing platform alone. Everything is simulated: no real rides, riders or money." />
    <meta name="theme-color" content="#07090d" />
    <script>
      // Without a session there is nothing on the home page, so go to the landing page before anything is drawn.
      if (/^\/home(\/|$)/.test(location.pathname) && !localStorage.getItem('thirrem-driver-token')) history.replaceState(null, '', '/');
      var light = localStorage.getItem('thirrem-theme') === 'light';
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#eef0f4' : '#07090d');
    </script>
    <style>
      html[data-theme='dark'] { background: #07090d; color: #98a1b3; color-scheme: dark; --boot-fg: #eef1f6; --boot-card: rgba(255, 255, 255, 0.05); --boot-border: rgba(255, 255, 255, 0.12); --boot-field: rgba(255, 255, 255, 0.04); --boot-raised: rgba(255, 255, 255, 0.1); --boot-track: rgba(255, 255, 255, 0.12); --boot-accent: #14b8a6; --boot-accent-text: #2dd4bf; }
      html[data-theme='light'] { background: #eef0f4; color: #566074; color-scheme: light; --boot-fg: #0c1018; --boot-card: rgba(255, 255, 255, 0.7); --boot-border: rgba(10, 16, 28, 0.12); --boot-field: rgba(255, 255, 255, 0.8); --boot-raised: #ffffff; --boot-track: rgba(10, 16, 28, 0.12); --boot-accent: #0d9488; --boot-accent-text: #0f6b64; }
      body { margin: 0; }
      .boot-page { min-height: 100vh; min-height: 100dvh; font: 15px system-ui, sans-serif; }
      .boot-bar { display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; height: 72px; padding: 0 20px; border-bottom: 1px solid var(--boot-border); background: var(--boot-card); }
      .boot-logo { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 22px; letter-spacing: -0.035em; color: var(--boot-fg); }
      .boot-logo i { width: 14px; height: 14px; border-radius: 50%; background: var(--boot-accent); box-shadow: 0 0 14px var(--boot-accent); }
      .boot-logo b { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--boot-accent-text); border: 1px solid var(--boot-accent); border-radius: 999px; padding: 2px 10px; }
      .boot-links { display: flex; gap: 14px; align-items: center; }
      .boot-who, .boot-logout { display: block; flex: none; background: linear-gradient(90deg, var(--boot-field), var(--boot-raised), var(--boot-field)); background-size: 200% 100%; animation: boot-shimmer 1.2s linear infinite; }
      .boot-who { width: 170px; height: 22px; border-radius: 8px; }
      .boot-toggle { width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--boot-border); background: var(--boot-card); }
      .boot-logout { width: 104px; height: 48px; border-radius: 12px; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .boot-card { box-sizing: border-box; width: calc(100% - 32px); max-width: 440px; min-height: 300px; margin: 40px auto 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; background: var(--boot-card); border: 1px solid var(--boot-border); }
      .boot-card p { margin: 0; }
      .boot-track, .boot-line { fill: none; stroke-linecap: round; stroke-width: 5; }
      .boot-track { stroke: var(--boot-track); }
      .boot-line { stroke: var(--boot-accent); stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .boot-dot { fill: #0f766e; stroke: #fff; stroke-width: 3; }
      .boot-pin { transform-box: fill-box; transform-origin: 50% 100%; animation: boot-pin 2.2s ease-in-out infinite; }
      @keyframes boot-draw { 0% { stroke-dashoffset: 1; } 70%, 100% { stroke-dashoffset: 0; } }
      @keyframes boot-pin { 0%, 55% { opacity: 0.35; transform: translateY(-4px) scale(0.9); } 75%, 100% { opacity: 1; transform: none; } }
      @keyframes boot-shimmer { to { background-position: -200% 0; } }
      @media (max-width: 560px) { .boot-who { display: none; } }
      @media (max-width: 440px) { .boot-bar { padding: 0 12px; } .boot-logo { gap: 8px; font-size: 19px; } }
      @media (prefers-reduced-motion: reduce) { .boot-line, .boot-pin, .boot-who, .boot-logout { animation: none; } .boot-line { stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="boot-home">
      <div class="boot-page" aria-busy="true">
        <header class="boot-bar">
          <span class="boot-logo"><i></i><span translate="no">Thirrem</span><b>Driver</b></span>
          <span class="boot-links"><span class="boot-who"></span><span class="boot-toggle"></span><span class="boot-logout"></span></span>
        </header>
        <span class="boot-sr" role="status">Loading your home page…</span>
        <main class="boot-card">
          <div aria-hidden="true">
            <svg width="220" height="130" viewBox="0 0 220 130">
              <path class="boot-track" d="M34 100 C 78 100, 70 42, 112 56 S 160 78, 182 50" />
              <path class="boot-line" d="M34 100 C 78 100, 70 42, 112 56 S 160 78, 182 50" pathLength="1" />
              <circle class="boot-dot" cx="34" cy="100" r="9" />
              <g transform="translate(165 8)">
                <g class="boot-pin">
                  <svg viewBox="0 0 34 44" width="34" height="44" overflow="visible">
                    <path d="M17 43C17 43 3 27.5 3 16.5C3 8.5 9.3 2 17 2s14 6.5 14 14.5C31 27.5 17 43 17 43z" fill="#0f766e" stroke="var(--boot-fg)" stroke-width="2.5" />
                    <circle cx="17" cy="16.5" r="5.5" fill="var(--boot-fg)" />
                  </svg>
                </g>
              </g>
            </svg>
          </div>
          <p>Loading your account…</p>
        </main>
      </div>
    </template>
    <script>
      if (/^\/home(\/|$)/.test(location.pathname)) {
        document.getElementById('root').appendChild(document.getElementById('boot-home').content.cloneNode(true));
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
